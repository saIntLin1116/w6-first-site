<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>日常誌｜個人行程與任務管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="日常誌首頁"><span class="brand-mark" aria-hidden="true">日</span><span>日常誌</span></a>
      <span class="topbar-note">把每一天，安排得剛剛好</span>
    </header>

    <section class="intro" id="top" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow">MY DAILY PLANNER</p>
        <h1 id="page-title">今天，也一步一步來。</h1>
        <p class="intro-subtitle">整理行程、完成待辦，留一點空間給自己。</p>
      </div>
      <div class="date-card">
        <span class="date-label">今天是</span>
        <time id="today-date" datetime="">載入日期中</time>
      </div>
    </section>

    <div class="dashboard-grid">
      <section class="panel schedule-panel" aria-labelledby="schedule-title">
        <div class="section-heading">
          <div><p class="section-kicker">YOUR DAY</p><h2 id="schedule-title">今日行程</h2></div>
          <span class="count-pill" id="schedule-count">3 個安排</span>
        </div>
        <ol class="schedule-list" id="schedule-list" aria-live="polite"></ol>
      </section>

      <section class="panel tasks-panel" aria-labelledby="tasks-title">
        <div class="section-heading">
          <div><p class="section-kicker">SMALL STEPS</p><h2 id="tasks-title">今日待辦</h2></div>
          <span class="count-pill" id="task-count">3 項任務</span>
        </div>
        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <form class="task-form" id="task-form">
          <label class="visually-hidden" for="task-name">待辦事項</label>
          <input id="task-name" name="task-name" type="text" placeholder="新增一項待辦…" required>
          <label class="visually-hidden" for="task-status">待辦狀態</label>
          <select id="task-status" name="task-status"><option value="pending">待處理</option><option value="progress">進行中</option><option value="done">已完成</option></select>
          <button type="submit" class="task-add-button" aria-label="新增待辦">＋</button>
        </form>
      </section>

      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading form-heading">
          <div><p class="section-kicker">MAKE A PLAN</p><h2 id="form-title">新增行程</h2></div>
          <span class="sparkle" aria-hidden="true">✳</span>
        </div>
        <form id="schedule-form">
          <div class="form-row">
            <div class="field"><label for="event-name">行程名稱</label><input id="event-name" name="event-name" type="text" placeholder="例如：和朋友喝咖啡" required></div>
            <div class="field field-time"><label for="event-time">開始時間</label><input id="event-time" name="event-time" type="time" required></div>
          </div>
          <div class="field"><label for="event-note">備註 <span class="optional">選填</span></label><input id="event-note" name="event-note" type="text" placeholder="地點或想記下的小提醒"></div>
          <button class="submit-button" type="submit"><span aria-hidden="true">＋</span> 加入今日行程</button>
          <p class="form-feedback" id="form-feedback" aria-live="polite"></p>
        </form>
      </section>
    </div>
    <footer class="footer"><span>留一點餘裕，讓好事發生。</span><span>DAILY PLANNER <span aria-hidden="true">✳</span></span></footer>
  </main>
</body>
</html>
